<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED8A1"/>
      <stop offset="50%" stop-color="#C6A46A"/>
      <stop offset="100%" stop-color="#9E7D47"/>
    </linearGradient>
  </defs>
  <!-- Background subtle badge -->
  <rect width="120" height="120" rx="16" fill="#101820" />
  
  <!-- Architectural Crane and Brick Tower Emblem -->
  <!-- Tower Crane Lattice -->
  <path d="M46 22 L72 22 L54 10 L46 22 Z" fill="url(#goldGrad)" />
  <rect x="52" y="22" width="6" height="76" fill="url(#goldGrad)" />
  <line x1="52" y1="28" x2="58" y2="34" stroke="#101820" stroke-width="1.5" />
  <line x1="58" y1="34" x2="52" y2="40" stroke="#101820" stroke-width="1.5" />
  <line x1="52" y1="40" x2="58" y2="46" stroke="#101820" stroke-width="1.5" />
  <line x1="58" y1="46" x2="52" y2="52" stroke="#101820" stroke-width="1.5" />
  <line x1="52" y1="52" x2="58" y2="58" stroke="#101820" stroke-width="1.5" />
  <line x1="58" y1="58" x2="52" y2="64" stroke="#101820" stroke-width="1.5" />
  <line x1="52" y1="64" x2="58" y2="70" stroke="#101820" stroke-width="1.5" />
  <line x1="58" y1="70" x2="52" y2="76" stroke="#101820" stroke-width="1.5" />
  <!-- Jib Horizontal Arm -->
  <rect x="22" y="22" width="76" height="4.5" fill="url(#goldGrad)" rx="1" />
  <!-- Counterweight -->
  <rect x="22" y="20" width="10" height="9" fill="url(#goldGrad)" rx="1" />
  <!-- Cable & Hook -->
  <line x1="82" y1="26" x2="82" y2="36" stroke="#C6A46A" stroke-width="1.5" stroke-dasharray="2 1" />
  <circle cx="82" cy="38" r="2" fill="url(#goldGrad)" />
  <circle cx="82" cy="43" r="1.5" fill="url(#goldGrad)" />

  <!-- Masonry / Brick Pyramid Foundation Left -->
  <rect x="24" y="86" width="11" height="6" fill="url(#goldGrad)" rx="0.5" />
  <rect x="37" y="86" width="12" height="6" fill="url(#goldGrad)" rx="0.5" />
  <rect x="28" y="78" width="10" height="6" fill="url(#goldGrad)" rx="0.5" />
  <rect x="40" y="78" width="9" height="6" fill="url(#goldGrad)" rx="0.5" />
  <rect x="32" y="70" width="11" height="6" fill="url(#goldGrad)" rx="0.5" />
  <polygon points="38,62 48,52 48,68 38,68" fill="url(#goldGrad)" />
  <!-- Base Foundation line -->
  <rect x="20" y="94" width="80" height="3" fill="url(#goldGrad)" rx="1.5" />
</svg>
